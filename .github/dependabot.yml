# Dependabot version updates (Milestone 2, package M2-S01): one weekly pull
# request per ecosystem group, for the npm workspaces (package-lock.json), the
# GitHub Actions of .github/workflows (pinned to commit SHAs with the tag in a
# comment, rule S-4, which Dependabot keeps in step) and the base images of the
# Dockerfiles in deploy/docker. A release must be 14 days old before it is
# proposed, the same age rule as for pinned images (S-5).
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '02:00'
      timezone: Asia/Jakarta
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: deps
    groups:
      npm-production:
        dependency-type: production
        update-types: [minor, patch]
      npm-development:
        dependency-type: development
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
    # Majors left out on purpose (Milestone 3, package M3-M02). Remove a rule
    # when its reason no longer holds.
    ignore:
      # The type definitions follow the Node.js major of the runtime: Node 22
      # in CI and in the release images. Definitions of a newer major describe
      # functions that Node 22 lacks. Move this rule with the runtime.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 ships the compiler as a native program, and its package no
      # longer offers the compiler API that typescript-eslint loads for the
      # lint. No typescript-eslint release supports it yet (8.72 accepts
      # TypeScript below 6.1). TypeScript 6.0 is still proposed.
      - dependency-name: typescript
        versions: ['>=7.0.0']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '02:00'
      timezone: Asia/Jakarta
    cooldown:
      default-days: 14
    labels: [dependencies]
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']

  # Dependabot reads the image on each FROM line. The Dockerfiles name their
  # base images through ARG defaults (FROM ${NODE_IMAGE}), so this entry may
  # propose nothing; docs/saas/release.md, "Dependency updates", has the limit.
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: weekly
      day: monday
      time: '02:00'
      timezone: Asia/Jakarta
    cooldown:
      default-days: 14
    labels: [dependencies]
    commit-message:
      prefix: images
    groups:
      base-images:
        patterns: ['*']
