# MSCD release (Milestone 2, package M2-S01; docs/saas/release.md).
#
# A pushed tag vX.Y.Z or vX.Y.Z-rc.N, or a run started by hand from that tag,
# builds the release images with deploy/scripts/build-release-images.sh. The
# script checks them (release artefact check R-13, Trivy gate) before it pushes
# them to ghcr.io/mqusaeri. This workflow then signs both digests with keyless
# cosign, attaches the SBOM and the build provenance as signed attestations and
# creates the GitHub Release with digests.json. In a public repository it also
# adds GitHub artifact attestations of the build provenance. deploy-prod.yml
# deploys only these digests, after cosign verify.
#
# Environment release (the owner approves every run). Secrets
# MSCD_PACK_SIGNING_KEY and MSCD_RELEASE_SIGNING_KEY; variables
# MSCD_TRUSTED_KEYS_LICENCE_PUB, MSCD_TRUSTED_KEYS_PACK_PUB and
# MSCD_TRUSTED_KEYS_ANCHOR_PUB (one or more PEM public keys each).
# deploy/scripts/saas-keys.sh prints the commands that set them. Optional
# repository secret MSCD_BUILD_CA, as in ci.yml.
#
# A run by hand starts from the tag, so the signing identity names the tag:
#   gh workflow run release.yml --ref v1.1.0 -f tag=v1.1.0 [-f bundle=true]
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, vX.Y.Z or vX.Y.Z-rc.N (start the run from the same tag)
        required: true
        type: string
      bundle:
        description: Also build the signed on-premise bundle and attach it to the release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/mqusaeri
  COSIGN_RELEASE: v3.1.3
  OIDC_ISSUER: https://token.actions.githubusercontent.com

jobs:
  images:
    name: Build, check, push and sign the release images
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Release tag
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ]; then
            tag=$INPUT_TAG
            if [ "$REF" != "refs/tags/$tag" ]; then
              echo "::error::Start the run from the tag so the signature names it: gh workflow run release.yml --ref $tag -f tag=$tag"
              exit 1
            fi
          else
            tag=${REF#refs/tags/}
          fi
          if ! printf '%s' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$'; then
            echo "::error::Tag '$tag' is not vX.Y.Z or vX.Y.Z-rc.N"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Version and release checks
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          base=$(jq -r .version apps/server/package.json)
          if [ "${VERSION%%-*}" != "$base" ]; then
            echo "::error::Tag $TAG does not match the server version $base in apps/server/package.json"
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::The GitHub Release $TAG exists. Each version is released once; publish a new version instead."
            exit 1
          fi

      - name: Docker with the containerd image store (keeps the SBOM and provenance of the checked images)
        run: |
          set -euo pipefail
          if docker info --format '{{json .DriverStatus}}' | grep -q io.containerd.snapshotter.v1; then exit 0; fi
          config=/etc/docker/daemon.json
          current='{}'
          if sudo test -s "$config"; then current=$(sudo cat "$config"); fi
          printf '%s' "$current" | jq '.features["containerd-snapshotter"] = true' | sudo tee "$config" >/dev/null
          sudo systemctl restart docker
          for _ in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
          docker info --format '{{json .DriverStatus}}' | grep -q io.containerd.snapshotter.v1

      - name: Build CA
        env:
          BUILD_CA: ${{ secrets.MSCD_BUILD_CA }}
        run: |
          printf '%s' "$BUILD_CA" > "$RUNNER_TEMP/build-ca.pem"
          echo "MSCD_BUILD_CA=$RUNNER_TEMP/build-ca.pem" >> "$GITHUB_ENV"

      - name: Release keys (outside the work tree)
        env:
          LICENCE_PUB: ${{ vars.MSCD_TRUSTED_KEYS_LICENCE_PUB }}
          PACK_PUB: ${{ vars.MSCD_TRUSTED_KEYS_PACK_PUB }}
          ANCHOR_PUB: ${{ vars.MSCD_TRUSTED_KEYS_ANCHOR_PUB }}
          PACK_SIGNING_KEY: ${{ secrets.MSCD_PACK_SIGNING_KEY }}
        run: |
          set -euo pipefail
          keys=$RUNNER_TEMP/trusted-keys
          install -d -m 0755 "$keys"
          # split_pem KIND NAME VALUE: one file per PEM block, <kind>-release-<n>.pub
          split_pem() {
            if [ -z "$3" ]; then
              echo "::error::Variable $2 is not set in environment release"
              exit 1
            fi
            printf '%s\n' "$3" | tr -d '\r' | awk -v dir="$keys" -v kind="$1" '
              /-----BEGIN PUBLIC KEY-----/ { n++; file = sprintf("%s/%s-release-%d.pub", dir, kind, n); inside = 1 }
              inside { print > file }
              /-----END PUBLIC KEY-----/ { inside = 0; close(file) }
              END { if (n == 0) exit 1 }' || { echo "::error::Variable $2 holds no PEM public key"; exit 1; }
          }
          split_pem licence MSCD_TRUSTED_KEYS_LICENCE_PUB "$LICENCE_PUB"
          split_pem pack MSCD_TRUSTED_KEYS_PACK_PUB "$PACK_PUB"
          split_pem anchor MSCD_TRUSTED_KEYS_ANCHOR_PUB "$ANCHOR_PUB"
          for file in "$keys"/*.pub; do openssl pkey -pubin -in "$file" -noout; done
          ls -l "$keys"
          if [ -z "$PACK_SIGNING_KEY" ]; then
            echo "::error::Secret MSCD_PACK_SIGNING_KEY is not set in environment release"
            exit 1
          fi
          (umask 077 && printf '%s\n' "$PACK_SIGNING_KEY" > "$RUNNER_TEMP/pack-signing.key")
          chmod 0600 "$RUNNER_TEMP/pack-signing.key"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin

      - name: Build, check and push the release images
        id: images
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          bash deploy/scripts/build-release-images.sh --version "$VERSION" \
            --trusted-keys-dir "$RUNNER_TEMP/trusted-keys" --pack-signing-key "$RUNNER_TEMP/pack-signing.key" \
            --build-ca "$MSCD_BUILD_CA" --registry "$REGISTRY" --push \
            --digest-file "$RUNNER_TEMP/digests.json" --source-url "$SOURCE_URL"
          cat "$RUNNER_TEMP/digests.json"
          echo "server=$(jq -r .server "$RUNNER_TEMP/digests.json")" >> "$GITHUB_OUTPUT"
          echo "web=$(jq -r .web "$RUNNER_TEMP/digests.json")" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_RELEASE }}

      - name: Sign the images and attach the SBOM and the provenance
        run: |
          set -euo pipefail
          # The signing identity: this workflow at the release tag.
          identity="$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF"
          echo "Signing identity: $identity"
          for name in server web; do
            ref=$(jq -r ".${name}Ref" "$RUNNER_TEMP/digests.json")
            case "$ref" in
              "$REGISTRY"/*@sha256:*) ;;
              *) echo "::error::Unexpected image reference '$ref' in digests.json"; exit 1 ;;
            esac
            sbom=$RUNNER_TEMP/sbom-$name.spdx.json
            provenance=$RUNNER_TEMP/provenance-$name.json
            docker buildx imagetools inspect "$ref" --format '{{ json .SBOM.SPDX }}' > "$sbom"
            docker buildx imagetools inspect "$ref" --format '{{ json .Provenance.SLSA }}' > "$provenance"
            jq -e '.spdxVersion' "$sbom" >/dev/null || { echo "::error::$ref carries no SPDX SBOM"; exit 1; }
            if jq -e '.buildDefinition' "$provenance" >/dev/null; then type=slsaprovenance1
            elif jq -e '.buildType' "$provenance" >/dev/null; then type=slsaprovenance02
            else echo "::error::$ref carries no build provenance"; exit 1
            fi
            echo "$ref: SBOM $(jq -r .spdxVersion "$sbom"), provenance attestation type $type"
            cosign sign --yes "$ref"
            cosign attest --yes --type spdxjson --predicate "$sbom" "$ref"
            cosign attest --yes --type "$type" --predicate "$provenance" "$ref"
            cosign verify "$ref" --certificate-identity "$identity" --certificate-oidc-issuer "$OIDC_ISSUER" >/dev/null
            cosign verify-attestation "$ref" --type spdxjson \
              --certificate-identity "$identity" --certificate-oidc-issuer "$OIDC_ISSUER" >/dev/null
            cosign verify-attestation "$ref" --type "$type" \
              --certificate-identity "$identity" --certificate-oidc-issuer "$OIDC_ISSUER" >/dev/null
            echo "Signed and verified: $ref"
          done

      # GitHub artifact attestations (gh attestation verify) in addition to the
      # cosign attestations above; GitHub offers them for public repositories.
      - name: GitHub build provenance of the server image
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/mscd-server
          subject-digest: ${{ steps.images.outputs.server }}
          push-to-registry: true

      - name: GitHub build provenance of the web image
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/mscd-web
          subject-digest: ${{ steps.images.outputs.web }}
          push-to-registry: true

      - name: GitHub Release with digests.json
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          d=$RUNNER_TEMP/digests.json
          identity="$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF"
          notes=$RUNNER_TEMP/release-notes.md
          {
            echo "MSCD $VERSION release images, built from commit $(jq -r .revision "$d")."
            echo
            echo "| Image | Digest |"
            echo "|---|---|"
            echo "| \`$(jq -r .serverImage "$d")\` | \`$(jq -r .server "$d")\` |"
            echo "| \`$(jq -r .webImage "$d")\` | \`$(jq -r .web "$d")\` |"
            echo
            echo "Both images are signed with keyless cosign and carry an SPDX SBOM and the SLSA build provenance as signed attestations. Deploy by digest only, after verifying the signature:"
            echo
            echo '```bash'
            echo "cosign verify $(jq -r .serverRef "$d") \\"
            echo "  --certificate-identity $identity \\"
            echo "  --certificate-oidc-issuer $OIDC_ISSUER"
            echo '```'
            echo
            echo "digests.json lists both digests; the SBOM files are attached as well."
          } > "$notes"
          flags=()
          case "$VERSION" in *-rc.*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" "$d" "$RUNNER_TEMP/sbom-server.spdx.json" "$RUNNER_TEMP/sbom-web.spdx.json" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "MSCD $VERSION" --notes-file "$notes" "${flags[@]}"
          cat "$notes" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image-logs
          path: deploy/dist/mscd-images-*.logs
          retention-days: 14

      - name: Remove the keys and the registry login
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/pack-signing.key" "$RUNNER_TEMP/trusted-keys"
          docker logout ghcr.io || true

  bundle:
    name: Signed on-premise bundle
    needs: images
    if: github.event_name == 'workflow_dispatch' && inputs.bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.images.outputs.tag }}
          persist-credentials: false

      - name: Build CA
        env:
          BUILD_CA: ${{ secrets.MSCD_BUILD_CA }}
        run: |
          printf '%s' "$BUILD_CA" > "$RUNNER_TEMP/build-ca.pem"
          echo "MSCD_BUILD_CA=$RUNNER_TEMP/build-ca.pem" >> "$GITHUB_ENV"

      - name: Release keys (outside the work tree)
        env:
          LICENCE_PUB: ${{ vars.MSCD_TRUSTED_KEYS_LICENCE_PUB }}
          PACK_PUB: ${{ vars.MSCD_TRUSTED_KEYS_PACK_PUB }}
          ANCHOR_PUB: ${{ vars.MSCD_TRUSTED_KEYS_ANCHOR_PUB }}
          PACK_SIGNING_KEY: ${{ secrets.MSCD_PACK_SIGNING_KEY }}
          RELEASE_SIGNING_KEY: ${{ secrets.MSCD_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          keys=$RUNNER_TEMP/trusted-keys
          install -d -m 0755 "$keys"
          split_pem() {
            if [ -z "$3" ]; then
              echo "::error::Variable $2 is not set in environment release"
              exit 1
            fi
            printf '%s\n' "$3" | tr -d '\r' | awk -v dir="$keys" -v kind="$1" '
              /-----BEGIN PUBLIC KEY-----/ { n++; file = sprintf("%s/%s-release-%d.pub", dir, kind, n); inside = 1 }
              inside { print > file }
              /-----END PUBLIC KEY-----/ { inside = 0; close(file) }
              END { if (n == 0) exit 1 }' || { echo "::error::Variable $2 holds no PEM public key"; exit 1; }
          }
          split_pem licence MSCD_TRUSTED_KEYS_LICENCE_PUB "$LICENCE_PUB"
          split_pem pack MSCD_TRUSTED_KEYS_PACK_PUB "$PACK_PUB"
          split_pem anchor MSCD_TRUSTED_KEYS_ANCHOR_PUB "$ANCHOR_PUB"
          if [ -z "$PACK_SIGNING_KEY" ] || [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::Secrets MSCD_PACK_SIGNING_KEY and MSCD_RELEASE_SIGNING_KEY must be set in environment release"
            exit 1
          fi
          (umask 077 && printf '%s\n' "$PACK_SIGNING_KEY" > "$RUNNER_TEMP/pack-signing.key")
          (umask 077 && printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/bundle-signing.key")
          chmod 0600 "$RUNNER_TEMP/pack-signing.key" "$RUNNER_TEMP/bundle-signing.key"

      # The bundle build holds five images and their saved copies at once. The
      # runner's Android SDK, .NET and Haskell toolchains are not used here.
      - name: Free disk space for the images
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - name: Build the signed bundle
        env:
          VERSION: ${{ needs.images.outputs.version }}
        run: |
          bash deploy/scripts/build-bundle.sh --release --version "$VERSION" \
            --trusted-keys-dir "$RUNNER_TEMP/trusted-keys" --pack-signing-key "$RUNNER_TEMP/pack-signing.key" \
            --sign-key "$RUNNER_TEMP/bundle-signing.key" --build-ca "$MSCD_BUILD_CA" --output "$RUNNER_TEMP/dist"

      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.images.outputs.tag }}
          VERSION: ${{ needs.images.outputs.version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dist"
          sha256sum -c "mscd-onprem-$VERSION.tar.gz.sha256"
          gh release upload "$TAG" "mscd-onprem-$VERSION.tar.gz" "mscd-onprem-$VERSION.tar.gz.sha256" mscd-release.pub \
            --repo "$GITHUB_REPOSITORY"

      - name: Upload the build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-logs
          path: ${{ runner.temp }}/dist/*.logs
          retention-days: 14

      - name: Remove the keys
        if: always()
        run: rm -rf "$RUNNER_TEMP/pack-signing.key" "$RUNNER_TEMP/bundle-signing.key" "$RUNNER_TEMP/trusted-keys"
