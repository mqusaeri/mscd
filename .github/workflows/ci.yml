# MSCD continuous integration (build plan J.10).
#
# Every push and pull request: lint, typecheck and unit tests; integration tests
# on PostgreSQL 15, 16 and 17; the web E2E suites (sample data and API, each as
# shards of a matrix with a final merge job, M2-21); the
# images (web, release server with rehearsal keys, demo server) with the release
# artefact check (R-13) and a vulnerability scan; the full-stack smoke test; the
# static Helm checks; the writing rules; the SaaS static checks (workflows,
# Compose overlays, alert rules, scripts, go-live checklist) and the integration
# tests with tenancy multi (Milestone 2 K.6, M2-S13).
# Pushes to the default branch and nightly: the SaaS end-to-end run on release
# images with throwaway keys, the monitoring overlay with Grafana, the backup
# and restore test, and the deploy rehearsal.
# Nightly (and by hand): the Helm install test in k3s and an offline bundle
# rehearsal (build, install, uninstall).
#
# Optional repository secret MSCD_BUILD_CA: the CA certificate of a
# TLS-inspecting proxy between the runners and the npm registry or the Alpine
# mirrors. Each job that builds images writes it to a file (an empty file when
# the secret is not set) and exports MSCD_BUILD_CA (R-12).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      nightly:
        description: Also run the nightly jobs (Helm install test in k3s, offline bundle rehearsal, SaaS end-to-end run)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PLAYWRIGHT_VERSION: 1.56.1
  TESTCONTAINERS_RYUK_DISABLED: 'true'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'

jobs:
  lint-typecheck-unit:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Generated views are up to date
        run: npm run gen:views:check -w @mscd/web
      - name: Pack sources match the sample and validate
        run: |
          node packs/scripts/extract-from-sample.mjs --check
          node packs/scripts/validate-sources.mjs
      - name: Third-party notices match package-lock.json (THIRD-PARTY-NOTICES.md, M3-M01)
        run: node tools/scripts/third-party-notices.mjs --check
      - name: Shell scripts
        # Each folder from its own place, so -x follows the files the scripts source.
        run: |
          docker run --rm -v "$PWD/deploy:/d:ro" -w /d/scripts koalaman/shellcheck:stable -x \
            install.sh upgrade.sh uninstall.sh build-bundle.sh check-release-artefacts.sh deploy-demo.sh lib/common.sh \
            build-release-images.sh saas-keys.sh saas-deploy.sh saas-ops.sh bootstrap-host.sh lib/saas.sh \
            test/saas-stack.sh test/saas-rehearsal.sh
          docker run --rm -v "$PWD/deploy:/d:ro" -w /d/backup koalaman/shellcheck:stable -x \
            backup.sh backup-run.sh restore.sh restore-test.sh lib.sh
          docker run --rm -v "$PWD/deploy:/d:ro" -w /d/ops koalaman/shellcheck:stable -x test-ops.sh
          docker run --rm -v "$PWD/deploy:/d:ro" -w /d koalaman/shellcheck:stable -s sh \
            nginx/40-mscd-runtime.sh compose/config/postgres/10-mscd-bootstrap.sh ops/ops-init.sh
      - name: Compose files
        run: |
          docker compose -f deploy/compose/docker-compose.yml config -q
          docker compose -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.demo.yml config -q
          docker compose --env-file /dev/null -f deploy/compose/docker-compose.yml -f deploy/compose/docker-compose.demo.yml \
            -f deploy/compose/docker-compose.vps.yml config -q

  text-rules:
    name: Writing rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: No em dash or centre dot in the documents
        run: |
          npm run check:text
          node tools/scripts/check-text.mjs deploy/README.md deploy/scripts deploy/compose deploy/nginx deploy/docker deploy/helm .github

  integration:
    name: Integration tests (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        postgres: ['15', '16', '17']
        include:
          - postgres: '15'
            image: postgres:15-alpine
          - postgres: '16'
            image: postgres:16.15-alpine
          - postgres: '17'
            image: postgres:17-alpine
    env:
      MSCD_TEST_PG_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: jq (test/int/saas-ops runs saas-ops.sh and the input step of ops-cli.yml)
        run: command -v jq >/dev/null || { sudo apt-get update && sudo apt-get install -y jq; }
      - name: Integration tests
        run: npm run test:int
      - name: Remove test containers
        if: always()
        run: docker ps -aq --filter label=mscd.test=true | xargs -r docker rm -f

  # The browser suites run as shards of a matrix (Milestone 2 M2-21): each shard runs its share of the tests and
  # writes a blob report; the final job of each suite, named as before so the required checks keep working, merges
  # the blob reports into one HTML report and fails when any shard failed. Shards and their lanes or workers follow
  # the memory budget of tools/scripts/e2e-budget.mjs on the runner (half the CPUs, at most 6 lanes or 10 workers).
  e2e-sample-shard:
    name: Web E2E (sample data) shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Playwright browsers cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system packages
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Web build cache (rebuilt only when the sources changed)
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/mscd/e2e
          key: e2e-web-sample-${{ hashFiles('apps/web/src/**', 'apps/web/public/**', 'apps/web/index.html', 'apps/web/vite.config.js', 'apps/web/package.json', 'packages/shared/src/**', 'package-lock.json') }}
      - name: E2E suite, one shard
        env:
          CI: '1'
          TZ: UTC
          E2E_REPORT: blob
        run: npm run test:e2e -w @mscd/web -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Upload the blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-sample-blob-${{ matrix.shard }}
          path: apps/web/blob-report/sample
          retention-days: 7
      - name: Upload the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-sample-results-${{ matrix.shard }}
          path: apps/web/test-results
          retention-days: 7

  e2e-sample:
    name: Web E2E (sample data)
    if: ${{ !cancelled() }}
    needs: e2e-sample-shard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download the blob reports of the shards
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-sample-blob-*
          path: blob-reports
          merge-multiple: true
      - name: Merge them into one HTML report
        run: npx --yes playwright@${{ env.PLAYWRIGHT_VERSION }} merge-reports --reporter html ./blob-reports
      - name: Upload the Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: e2e-sample-report
          path: playwright-report
          retention-days: 7
      - name: Every shard passed
        if: needs.e2e-sample-shard.result != 'success'
        run: |
          echo "A shard of the sample suite failed (result: ${{ needs.e2e-sample-shard.result }}); the merged report has the details."
          exit 1

  e2e-api-shard:
    name: Web E2E (API) shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Playwright browsers cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system packages
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Web build cache (rebuilt only when the sources changed)
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/mscd/e2e
          key: e2e-web-api-${{ hashFiles('apps/web/src/**', 'apps/web/public/**', 'apps/web/index.html', 'apps/web/vite.config.js', 'apps/web/package.json', 'packages/shared/src/**', 'package-lock.json') }}
      - name: E2E suite against the API, one shard
        env:
          CI: '1'
          TZ: UTC
          E2E_REPORT: blob
        run: npm run test:e2e:api -w @mscd/web -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Remove test containers
        if: always()
        run: docker ps -aq --filter label=mscd.test=true | xargs -r docker rm -f
      - name: Upload the blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-api-blob-${{ matrix.shard }}
          path: apps/web/blob-report/api
          retention-days: 7
      - name: Upload the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-api-results-${{ matrix.shard }}
          path: apps/web/test-results
          retention-days: 7

  e2e-api:
    name: Web E2E (API)
    if: ${{ !cancelled() }}
    needs: e2e-api-shard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download the blob reports of the shards
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-api-blob-*
          path: blob-reports
          merge-multiple: true
      - name: Merge them into one HTML report
        run: npx --yes playwright@${{ env.PLAYWRIGHT_VERSION }} merge-reports --reporter html ./blob-reports
      - name: Upload the Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: e2e-api-report
          path: playwright-report
          retention-days: 7
      - name: Every shard passed
        if: needs.e2e-api-shard.result != 'success'
        run: |
          echo "A shard of the API suite failed (result: ${{ needs.e2e-api-shard.result }}); the merged report has the details."
          exit 1

  images:
    name: Images and release artefact check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build CA
        env:
          BUILD_CA: ${{ secrets.MSCD_BUILD_CA }}
        run: |
          printf '%s' "$BUILD_CA" > "$RUNNER_TEMP/build-ca.pem"
          echo "MSCD_BUILD_CA=$RUNNER_TEMP/build-ca.pem" >> "$GITHUB_ENV"
      - name: Rehearsal release keys (outside the repository)
        run: |
          npm run build -w @mscd/shared -w @mscd/pack-tools
          keys="$RUNNER_TEMP/rehearsal-keys"
          mkdir -p "$keys"
          for n in pack licence anchor; do
            node packages/pack-tools/dist/cli.js keygen --out "$keys" --name "$n-rehearsal"
          done
          mkdir -p "$RUNNER_TEMP/rehearsal-pub"
          cp "$keys"/*.pub "$RUNNER_TEMP/rehearsal-pub/"
          echo "REHEARSAL_KEYS=$keys" >> "$GITHUB_ENV"
      - name: Web image (API mode)
        run: |
          docker buildx build --load -f deploy/docker/web.Dockerfile \
            --build-context nginx-config=deploy/nginx \
            --secret id=build_ca,src="$MSCD_BUILD_CA" \
            --build-arg VITE_DATA_SOURCE=api --build-arg APK_UPGRADE=true \
            -t cyberlentera/mscd-web:ci .
      - name: Server image, release target
        run: |
          docker buildx build --load -f deploy/docker/server.Dockerfile --target release \
            --secret id=build_ca,src="$MSCD_BUILD_CA" \
            --secret id=pack_signing_key,src="$REHEARSAL_KEYS/pack-rehearsal.key" \
            --build-context trusted-keys="$RUNNER_TEMP/rehearsal-pub" \
            --build-arg APK_UPGRADE=true \
            -t cyberlentera/mscd-server:ci .
      - name: Server image, demo target
        run: |
          docker buildx build --load -f deploy/docker/server.Dockerfile --target demo \
            --secret id=build_ca,src="$MSCD_BUILD_CA" \
            -t cyberlentera/mscd-server-demo:ci .
      - name: Release artefact check (R-13)
        # CI images are rehearsal builds: packs without a lead auditor sign-off only warn (E.2).
        # release.yml never sets this.
        env:
          MSCD_ALLOW_UNSIGNED_PACKS: "1"
        run: bash deploy/scripts/check-release-artefacts.sh cyberlentera/mscd-server:ci cyberlentera/mscd-web:ci
      - name: The check finds development keys (self-test)
        run: |
          dir=$(mktemp -d)
          cp packages/pack-tools/dev-keys/pack-signing.pub "$dir/"
          if bash deploy/scripts/check-release-artefacts.sh "$dir"; then
            echo "check-release-artefacts.sh accepted a development key" >&2
            exit 1
          fi
      - name: Vulnerability scan (no HIGH or CRITICAL vulnerability with a fix)
        run: |
          for image in cyberlentera/mscd-server:ci cyberlentera/mscd-web:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              aquasec/trivy:0.74.0 image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done

  smoke:
    name: Full-stack smoke test
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build CA
        env:
          BUILD_CA: ${{ secrets.MSCD_BUILD_CA }}
        run: |
          printf '%s' "$BUILD_CA" > "$RUNNER_TEMP/build-ca.pem"
          echo "MSCD_BUILD_CA=$RUNNER_TEMP/build-ca.pem" >> "$GITHUB_ENV"
      - name: Playwright browsers cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system packages
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Smoke test
        run: npm run test:smoke
      - name: Upload the smoke results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: tools/smoke/test-results
          retention-days: 7

  helm-static:
    name: Helm chart static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Kubernetes schema cache
        uses: actions/cache@v4
        with:
          path: deploy/helm/mscd/ci/.schema-cache
          key: kubeconform-1.34.1-${{ hashFiles('deploy/helm/mscd/ci/validate.sh') }}
      - name: helm lint, helm template, kubeconform, render assertions
        run: bash deploy/helm/mscd/ci/validate.sh

  saas-static:
    name: SaaS static checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: SaaS workflows (pinned actions, permissions, secrets, concurrency)
        run: |
          node tools/scripts/check-workflows.mjs --self-test
          node tools/scripts/check-workflows.mjs --saas --require-all
      - name: Compose files of the SaaS stack with the backup and monitoring overlays
        run: |
          c=(docker compose --env-file deploy/compose/.env.saas.example -f deploy/compose/docker-compose.yml
            -f deploy/compose/docker-compose.saas.yml)
          "${c[@]}" config -q
          "${c[@]}" -f deploy/compose/docker-compose.backup.yml config -q
          "${c[@]}" -f deploy/compose/docker-compose.ops.yml config -q
          "${c[@]}" -f deploy/compose/docker-compose.ops.yml --profile grafana config -q
          "${c[@]}" -f deploy/compose/docker-compose.backup.yml -f deploy/compose/docker-compose.ops.yml config -q
      - name: Alert rules and monitoring settings (promtool, amtool, ops-init, blackbox, Caddy, dashboard)
        run: bash deploy/ops/test-ops.sh --static
      - name: Syntax of every SaaS script
        run: |
          for f in deploy/scripts/saas-deploy.sh deploy/scripts/saas-ops.sh deploy/scripts/saas-keys.sh \
            deploy/scripts/bootstrap-host.sh deploy/scripts/build-release-images.sh deploy/scripts/lib/saas.sh \
            deploy/scripts/test/saas-stack.sh deploy/scripts/test/saas-rehearsal.sh deploy/ops/test-ops.sh \
            deploy/backup/backup.sh deploy/backup/backup-run.sh deploy/backup/restore.sh \
            deploy/backup/restore-test.sh deploy/backup/lib.sh; do
            bash -n "$f"
          done
          sh -n deploy/ops/ops-init.sh
      - name: Go-live checklist (rows, statuses, evidence and links)
        # --agent-items-done is the acceptance of M2-S13; it fails while an agent row is open, and the
        # security scan row (GL-13) waits for dependency updates and the CodeQL triage.
        run: |
          node tools/scripts/check-golive.mjs --self-test
          node tools/scripts/check-golive.mjs docs/saas/go-live-checklist.md

  int-saas:
    name: Integration tests (tenancy multi, SaaS)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: jq (test/int/saas-ops runs saas-ops.sh and the input step of ops-cli.yml)
        run: command -v jq >/dev/null || { sudo apt-get update && sudo apt-get install -y jq; }
      - name: security, rbac and contract with tenancy multi; saas-ops, entitlements and domains
        run: npm run test:int:saas -w @mscd/server
      - name: Remove test containers
        if: always()
        run: docker ps -aq --filter label=mscd.test=true | xargs -r docker rm -f

  saas-smoke:
    name: SaaS end-to-end run, monitoring, backup and deploy rehearsal
    # Pushes to the default branch, nightly, and by hand with "nightly".
    if: >-
      (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) ||
      github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build CA
        env:
          BUILD_CA: ${{ secrets.MSCD_BUILD_CA }}
        run: |
          printf '%s' "$BUILD_CA" > "$RUNNER_TEMP/build-ca.pem"
          echo "MSCD_BUILD_CA=$RUNNER_TEMP/build-ca.pem" >> "$GITHUB_ENV"
      - name: jq (saas-ops.sh reads its values with it)
        run: command -v jq >/dev/null || { sudo apt-get update && sudo apt-get install -y jq; }
      - name: Free disk space for the release images and Grafana
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /
      - name: Playwright browsers cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system packages
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: SaaS end-to-end run (throwaway keys, release images, every step in the browser)
        # saas-stack.sh makes a throwaway key set with saas-keys.sh in /tmp/mscd-saas-run, builds
        # the release images with it behind the Trivy gate, and deletes both at the end.
        run: npm run saas -w @mscd/smoke -- --with-ops
      - name: Monitoring overlay on the test stack, with the real Grafana image
        if: ${{ !cancelled() }}
        env:
          MSCD_OPS_TEST_GRAFANA: 'true'
        run: bash deploy/ops/test-ops.sh
      - name: Backup and restore end to end (restore-test.sh --local)
        if: ${{ !cancelled() }}
        # Root, as the backup timer and restore.sh run: it reads and writes the secret files of every service.
        run: sudo -E env "PATH=$PATH" bash deploy/backup/restore-test.sh --local
      - name: Deploy rehearsal (deploy, upgrade, automatic and manual rollback)
        if: ${{ !cancelled() }}
        # Root for setpriv: the deploys run as a user in the docker group, as on a server.
        run: sudo -E env "PATH=$PATH" bash deploy/scripts/test/saas-rehearsal.sh
      - name: Deploy workflow rehearsal (SSH, copy and deploy steps of deploy-prod.yml)
        if: ${{ !cancelled() }}
        run: sudo -E env "PATH=$PATH" bash deploy/scripts/test/saas-rehearsal.sh --workflow
      - name: Remove test containers
        if: always()
        run: docker ps -aq --filter label=mscd.test=true | xargs -r docker rm -f
      - name: Upload the SaaS run results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: saas-results
          path: tools/smoke/test-results/saas
          retention-days: 7

  helm:
    name: Helm install test (k3s)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly)
    needs: helm-static
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build CA
        env:
          BUILD_CA: ${{ secrets.MSCD_BUILD_CA }}
        run: |
          printf '%s' "$BUILD_CA" > "$RUNNER_TEMP/build-ca.pem"
          echo "MSCD_BUILD_CA=$RUNNER_TEMP/build-ca.pem" >> "$GITHUB_ENV"
      - name: Install, helm test and upgrade in k3s
        run: bash deploy/helm/mscd/ci/k3s-test.sh --build-ca "$MSCD_BUILD_CA"

  bundle:
    name: Offline bundle rehearsal
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly)
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build CA
        env:
          BUILD_CA: ${{ secrets.MSCD_BUILD_CA }}
        run: |
          printf '%s' "$BUILD_CA" > "$RUNNER_TEMP/build-ca.pem"
          echo "MSCD_BUILD_CA=$RUNNER_TEMP/build-ca.pem" >> "$GITHUB_ENV"
      - name: Rehearsal release keys (outside the repository)
        run: |
          npm run build -w @mscd/shared -w @mscd/pack-tools
          keys="$RUNNER_TEMP/rehearsal-keys"
          mkdir -p "$keys"
          for n in pack licence anchor; do
            node packages/pack-tools/dist/cli.js keygen --out "$keys" --name "$n-rehearsal"
          done
          openssl ecparam -name prime256v1 -genkey -noout -out "$keys/bundle-signing.key"
          echo "REHEARSAL_KEYS=$keys" >> "$GITHUB_ENV"
      - name: Free disk space for the images
        run: docker system df && df -h /
      - name: Bundle version
        # One patch above apps/server/package.json, so the version is never
        # lower than the engine_min_version of the packs (build-bundle.sh
        # refuses such a build; a pre-release of the same version is lower).
        run: |
          base=$(node -p "require('./apps/server/package.json').version")
          IFS=. read -r major minor patch <<<"${base%%-*}"
          echo "BUNDLE_VERSION=$major.$minor.$((patch + 1))-ci.${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Build the bundle
        # A rehearsal bundle: packs without a lead auditor sign-off only warn (E.2).
        env:
          MSCD_ALLOW_UNSIGNED_PACKS: "1"
        run: |
          deploy/scripts/build-bundle.sh --version "$BUNDLE_VERSION" \
            --trusted-keys-dir "$REHEARSAL_KEYS" --pack-signing-key "$REHEARSAL_KEYS/pack-rehearsal.key" \
            --sign-key "$REHEARSAL_KEYS/bundle-signing.key" --os-updates true --scan report
      - name: Check, install and uninstall the bundle
        run: |
          v=$BUNDLE_VERSION
          cd deploy/dist
          sha256sum -c "mscd-onprem-$v.tar.gz.sha256"
          mkdir -p "$RUNNER_TEMP/delivery"
          cp "mscd-onprem-$v.tar.gz" mscd-release.pub "$RUNNER_TEMP/delivery/"
          cd "$RUNNER_TEMP/delivery"
          tar -xzf "mscd-onprem-$v.tar.gz"
          cd "mscd-onprem-$v"
          sha256sum -c --quiet SHA256SUMS
          sudo ./install.sh --yes --self-signed --dir "$RUNNER_TEMP/mscd" --http-port 18090 --https-port 18453 \
            --org-slug rehearsal --org-name "CI Rehearsal" --verify-key ../mscd-release.pub
          curl -fsSk https://localhost:18453/api/v1/system/profile
          sudo ./uninstall.sh --dir "$RUNNER_TEMP/mscd" --purge --yes
      - name: Upload the build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-logs
          path: deploy/dist/*.logs
          retention-days: 7
