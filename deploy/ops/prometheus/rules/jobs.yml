# MSCD SaaS alert rules: background jobs (M2-S08). The worker counts every failed run of a
# job handler; a failed run is retried, so a single failure is not an alert.
groups:
  - name: mscd-jobs
    rules:
      # Three or more failed runs of one job within 30 minutes.
      #
      # The worker creates the series of a job at its first failure, with the value 1 (and
      # again after every restart). increase() cannot see that first step, so a series that
      # did not exist 30 minutes ago counts with its whole value: every failure it holds
      # happened inside the window. That part only counts when the worker answered the scrape
      # 30 minutes ago (up == 1); after a gap in the scrapes Prometheus cannot tell a new
      # series from an old one, and the old value would raise a false alert.
      - alert: JobFailuresRising
        expr: |
          sum by (job_name) (
              (increase(mscd_job_failures_total[30m]) and mscd_job_failures_total offset 30m)
            or
              (
                (mscd_job_failures_total unless mscd_job_failures_total offset 30m)
                  and on (job, instance) (up offset 30m == 1)
              )
          ) >= 3
        labels:
          severity: warning
        annotations:
          summary: "The job {{ $labels.job_name }} failed {{ $value | printf \"%.0f\" }} times in 30 minutes"
          action: "Read the worker log for this job. See docs/saas/monitoring.md#jobfailuresrising"

      # The oldest waiting job of a queue has waited more than 55 minutes.
      #
      # mscd_queue_oldest_age_seconds counts from the moment a job was queued, also for jobs
      # queued to start later: scheduler.tick (minute 5 of every hour) queues the daily jobs
      # of the hour up to 54 minutes before their start time (for example at 02:05 for 02:45),
      # and those jobs wait in the queue as planned. 55 minutes is above that lead time, so
      # the alert means a job that should have run is still waiting. Once the server measures
      # the age from the start time of jobs that are due (handoff M2-S08, follow-up), lower
      # the threshold to 900 seconds.
      - alert: JobQueueStuck
        expr: max by (queue) (mscd_queue_oldest_age_seconds) > 55 * 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Jobs of {{ $labels.queue }} wait for {{ $value | humanizeDuration }}"
          action: "Check that the worker runs and is healthy. See docs/saas/monitoring.md#jobqueuestuck"

      # Outbox rows that the job relay cannot hand over (BullMQ driver only).
      - alert: JobOutboxStuck
        expr: max(mscd_job_outbox_stuck_rows) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} job outbox rows are stuck"
          action: "Check the worker log and Valkey. See docs/saas/monitoring.md#joboutboxstuck"
