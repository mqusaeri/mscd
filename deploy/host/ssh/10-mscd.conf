# Managed by deploy/scripts/bootstrap-host.sh (docs/saas/bootstrap.md).
# The next run of the script writes this file again, so make changes there.
# sshd keeps the first value it reads for each setting, and this file is the
# first one in /etc/ssh/sshd_config.d, so these values win over later files.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PermitEmptyPasswords no
PubkeyAuthentication yes
AuthenticationMethods publickey
MaxAuthTries 4
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
ClientAliveInterval 300
ClientAliveCountMax 2
AllowUsers @ALLOW_USERS@
