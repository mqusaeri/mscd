// Managed by deploy/scripts/bootstrap-host.sh (docs/saas/bootstrap.md).
// Installed as /etc/apt/apt.conf.d/52mscd-unattended-upgrades, read after
// 20auto-upgrades and 50unattended-upgrades, so these values win.
//
// Ubuntu security updates are installed every day. The allowed origins stay
// those of 50unattended-upgrades (Ubuntu security and ESM), so Docker Engine
// is updated only by hand, in the maintenance window.
APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Download-Upgradeable-Packages "1";
APT::Periodic::Unattended-Upgrade "1";
APT::Periodic::AutocleanInterval "7";

// The server never reboots by itself. When an update needs a reboot,
// mscd-reboot-marker writes mscd_host_reboot_required 1 for the monitoring,
// and the owner reboots in the maintenance window.
Unattended-Upgrade::Automatic-Reboot "false";
Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
Unattended-Upgrade::Remove-New-Unused-Dependencies "true";
