# MSCD deployment profile: SaaS, many organisations in one installation (build plan I.1).
# Release profile. Same keys as onprem.yaml; it differs in tenancy, licence validation (D-32), channels, mail
# (required, port 587) and the trusted proxy (Helm: the web NGINX is one hop in front of the api, F.12). The KEK
# paths are the mounted Secrets of each service (D-09): Kubernetes Secrets with Helm, /run/secrets files with Compose.
#
# The SaaS Compose stack (deploy/compose/docker-compose.saas.yml, Milestone 2 M2-S02) keeps these values but sets
# some keys through environment variables (MSCD__<SECTION>__<KEY>, see x-app-env of docker-compose.yml):
#   http.trust_proxy   the fixed address of the web container (MSCD__HTTP__TRUST_PROXY), the only hop in front of
#                      the api; Caddy, in front of web, is trusted by NGINX, never by the api
#   http.public_url    https://<MSCD_DOMAIN> (MSCD__HTTP__PUBLIC_URL from MSCD_PUBLIC_URL)
#   mail.from, mail.smtp.*   the SMTP provider (MSCD__MAIL__*, from MSCD_SMTP_* and MSCD_MAIL_FROM)
#   database.*, gateway.vault.*, the secret file paths   as on-premise
tenancy:   { mode: multi, isolation: schema, default_region: id }
# Licences (D-32): each organisation's limits are its entitlement row, set by the operator from a plan preset below,
# from explicit limits, or from an uploaded signed licence (Milestone 2 M2-S10, docs/saas/entitlements.md). The
# presets are the D-S4 defaults; change them here. An empty `frameworks` list means every framework; null rate limits
# keep the defaults of every api request (600 per user and 6000 per organisation each minute).
license:
  validation: online
  plans:
    trial:    { max_users: 10, max_management_systems: 1, valid_days: 30, grace_days: 7, frameworks: [],
                storage_adapters: [managed_vault, m365, google_drive],
                features: [integrated_mode, edition_transition, link_health_monitor, auditor_guest_access],
                rate_user_per_minute: null, rate_org_per_minute: null }
    standard: { max_users: 50, max_management_systems: 3, valid_days: 365, grace_days: 30, frameworks: [],
                storage_adapters: [managed_vault, m365, google_drive],
                features: [integrated_mode, edition_transition, link_health_monitor, auditor_guest_access],
                rate_user_per_minute: null, rate_org_per_minute: null }
updates:   { channel: managed }
packs:     { channel: managed, dir: /app/packs, channel_url: null }
telemetry: { enabled: false, otlp_endpoint: null }
kms:       { provider: file, file: { path: /run/secrets/platform.key, previous_paths: [] } }   # only `file` (D-09)
identity:
  providers: [local, oidc, saml]
  local: { mfa_required: true }
  oidc: { allow_insecure_http: false }
  session: { idle_minutes: 60, absolute_hours: 8, remember_hours: 12, guest_idle_minutes: 30, guest_absolute_hours: 4 }
# SMTP submission on port 587 with STARTTLS (secure: false starts in plain text and switches to TLS when the
# provider offers it, as transactional providers on 587 do; secure: true is for implicit TLS on port 465).
mail:      { transport: smtp, required: true, from: "MSCD <mscd@example.internal>", smtp: { host: smtp, port: 587, secure: false, user: null, password_file: null } }
storage:
  adapters: { enabled: [managed_vault, m365, google_drive] }
  max_upload_bytes: 104857600
  gateway: { url: "https://storage-gateway:8443", token_file: /run/secrets/gateway.token,
             tls: { mode: mtls, ca_file: /run/secrets/ca.crt, cert_file: /run/secrets/client.crt, key_file: /run/secrets/client.key } }
network:   { egress_allowlist: [], dns_resolvers: [] }
legal:     { privacy_url: null, terms_url: null }            # sign-in page footer links (Milestone 2 D.2)
# End of contract, verified deletion and organisation export (Milestone 3 D.3, D.4, D.5). Values below 7 for the three
# day counts are refused unless MSCD_SAAS_TEST=1 is set (test stacks only) or the profile has the test section.
lifecycle: { offboarding_days: 30, deletion_grace_days: 30, deletion_min_grace_days: 7,
             export_part_bytes: 2147483648, export_max_bytes: 107374182400, export_link_days: 7, backup_copies_end_days: 780 }
# Requests from one person (due time) and how long sessions, tokens and notifications are kept (Milestone 3 D.6).
privacy:   { request_due_hours: 72, session_retention_days: 90, token_retention_days: 30, notification_retention_days: 365 }
jobs:      { driver: pgboss, schedules_enabled: true, bullmq: { url: null } }
http:      { port: 3000, public_url: "https://mscd.example.internal", trust_proxy: { cidrs: ["10.0.0.0/8"] } }   # Compose: env (header)
security:  { cookie_secure: true }
database:  { url_file: /run/secrets/db-app.url, migrator_url_file: /run/secrets/db-migrator.url,
             pack_installer_url_file: /run/secrets/db-pack.url, admin_url_file: null, pool_max: 10 }
audit:     { anchor_key_file: /run/secrets/audit-anchor.key }       # read by the worker only; its public key must be
                                                                    # one of the anchor keys compiled into the release
observability: { log_level: info, metrics_port: 9464 }
demo:      { enabled: false, acknowledge_insecure: false, fixed_today: null, personas: false, keycloak: null }
gateway:                                                  # read only by run mode storage-gateway
  port: 8443
  token_files: [/run/secrets/gateway.token, /run/secrets/gateway.token.previous]   # the second may be absent
  kms: { provider: file, file: { path: /run/secrets/storage.key, previous_paths: [] } }
  tls: { mode: mtls, ca_file: /run/secrets/ca.crt, cert_file: /run/secrets/gateway.crt, key_file: /run/secrets/gateway.key }
  vault: { endpoint: "http://objectstore:8333", region: us-east-1, bucket: mscd-vault, force_path_style: true,
           access_key_file: /run/secrets/s3.access, secret_key_file: /run/secrets/s3.secret }
  providers:
    m365: { graph_base_url: "https://graph.microsoft.com/v1.0", login_base_url: "https://login.microsoftonline.com" }
    google: { api_base_url: "https://www.googleapis.com", token_url: "https://oauth2.googleapis.com/token" }
